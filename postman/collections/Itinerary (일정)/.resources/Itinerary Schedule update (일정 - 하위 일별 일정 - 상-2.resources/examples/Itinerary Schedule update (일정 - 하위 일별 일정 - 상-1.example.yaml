$kind: http-example
name: Itinerary Schedule update (일정 - 하위 일별 일정 - 상세 일정 수정) - 축제
auth:
  type: bearer
  credentials:
    token: "{{bearer-token}}"
request:
  url: "{{server-url}}/api/itinerary/:itinerary/days/:itinearayDay/schedules/:id"
  method: PUT
  pathVariables:
    itinerary: "1"
    itinearayDay: "1"
    id: "1"
  body:
    type: json
    content: |-
      {
          "type" : "TOUR",
          "contentId" : "1081744"
      }
response:
  statusCode: 200
  statusText: ""
  body:
    type: json
    content: ""
order: 2000
