$kind: http-example
name: Itinerary Schedule update (일정 - 하위 일별 일정 - 상세 일정) 순서 변경
auth:
  type: bearer
  credentials:
    token: "{{bearer-token}}"
request:
  url: "{{server-url}}/api/itinerary/:itinerary/days/:itinearayDay/schedules/reorder"
  method: PUT
  pathVariables:
    itinerary: "1"
    itinearayDay: "1"
  body:
    type: json
    content: |-
      {
          "schedules": [
              {"id": 1, "sequence": 1},
              {"id": 3, "sequence": 2},
              {"id": 2, "sequence": 3}
          ]
      }
response:
  statusCode: 200
  statusText: ""
  body:
    type: json
    content: ""
order: 1000
